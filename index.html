<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jopserweb</title>
    <style>
        body {
            background-color: #0b0e14;
            color: white;
            font-family: sans-serif;
            text-align: center;
            padding-top: 50px;

        }
        h1 {
            color : #61dafb;
        }
        @keyframes hearts {
            0% {transform: translateY(-10vh) rotate(0deg); opacity: 1;}
            100% { transform: translateY(100vh) rotate(360deg); opacity: 0 ;}
        }
        .corazon {
            position: fixed;
            top: -10%;
            font-size: 20px;
            user-select: none;
            z-index: 1000;
            animation: hearts 5s linear infinite;
        }
    </style>
</head>
<body>
    <video width="320" autoplay muted loop style="border-radius: 15px; border: 3px solid #ff69b4; box-shadow: 0px 0px 20px #ff69b4; margin-top: 50px;">
    <source src="videos/patitas.mp4" type="video/mp4">
    Tu navegador no soporta videos.
</video>
<audio id="miMusica" autoplay loop style="display: none;">
    <source src="musica/lanita.mp3" type="audio/mpeg">
</audio>

   <p style="color: #ff69b4; font-size: 25px; font-weight: bold; margin-top: 30px;">TE AMO MARICELI❤️</p>
   <p style="color: white; font-size: 15px; font-weight: bold; margin-top: 20px;">(Dale click para escuchar)</p>
   <script>
  function crearCorazon() {
    const corazon = document.createElement('div');
    corazon.classList.add('corazon');
    corazon.innerHTML = '❤️';
    corazon.style.left = Math.random() * 100 + 'vw';
    corazon.style.animationDuration = Math.random() * 2 + 3 + 's';
    document.body.appendChild(corazon);
    setTimeout(() => { corazon.remove(); }, 5000);
  }
  setInterval(crearCorazon, 300);
</script>
<script>
    document.addEventListener('click', function() {
        var audio = document.getElementById('miMusica');
        audio.play();
    }, { once: true }); // Solo se ejecuta la primera vez que hace clic
</script>
</body>
</html>
